# Texts the server words itself, in English (see messages.properties for the default, Vietnamese): emails, CRM columns and templates, CRM cell problems.
# Keep the arguments ({0}, {1}...) and the keys identical to the Vietnamese file.

mail.passwordReset.subject=Your Orbit password reset code
mail.passwordReset.body=Your code is: {0}\n\nThe code is valid for 10 minutes. If you did not ask to reset your password, ignore this email.

mail.registration.subject=Your Orbit sign-up verification code
mail.registration.body=Your verification code is: {0}\n\nThe code is valid for 10 minutes. If you did not sign up for Orbit, ignore this email.

mail.emailChange.subject=Confirm your new email on Orbit
mail.emailChange.body=Your confirmation code is: {0}\n\nThe code is valid for 15 minutes. Give this code to the manager who is changing the email of your Orbit account. If you do not know about this, ignore this email.

mail.emailChanged.subject=Your Orbit account email was changed
mail.emailChanged.body=The registered email of your Orbit account was just changed to {0}.\n\nIf you do not know about this change, contact an administrator right away.

# {0} = company, {1} = inviter, {2} = link
mail.invitation.subject=Invitation to join {0} on Orbit
mail.invitation.body={1} invited you to join {0} on Orbit.\n\nOpen this link to create your account (valid for 7 days):\n{2}\n\nIf you do not know about this invitation, ignore this email.

# Job title given to the person who registers a company (they can edit it afterwards).
registration.adminTitle=Administrator

# CRM: the first columns of a new dataset, and why a cell was refused ({0} = the column's name).
crm.column.name=Full name
crm.column.email=Email
crm.column.phone=Phone
crm.problem.TOO_LONG=Column "{0}": the text is too long (2000 characters at most).
crm.problem.INVALID_NUMBER=Column "{0}": not a valid number.
crm.problem.INVALID_DATE=Column "{0}": not a valid date (for example 2026-10-08 or 08/10/2026).
crm.problem.INVALID_EMAIL=Column "{0}": not a valid email address.
crm.problem.INVALID_PHONE=Column "{0}": not a valid phone number (8 to 15 digits).

# CRM: the demonstration files people download before importing (all names are invented).
crm.template.title=Template for importing customers into Orbit
crm.template.sheet.data=Customers
crm.template.sheet.guide=Guide
crm.template.header.name=Full name
crm.template.header.email=Email
crm.template.header.phone=Phone
crm.template.header.company=Company
crm.template.header.note=Note
crm.template.sample.1.name=An Nguyen
crm.template.sample.1.email=an.nguyen@example.com
crm.template.sample.1.phone=0912 345 678
crm.template.sample.1.company=ABC Company
crm.template.sample.1.note=Met at the October event
crm.template.sample.2.name=Binh Tran
crm.template.sample.2.email=binh.tran@example.com
crm.template.sample.2.phone=0987 654 321
crm.template.sample.2.company=XYZ Company
crm.template.sample.2.note=Needs a quote
crm.template.guide.1=The first row of the table holds the column names; from the second row on, each row is one customer. Delete the two sample rows before importing.
crm.template.guide.2=Each sheet (or each table in Word) is one table of data. If the file has several, you choose the one to import in the next step. In Word, only what is inside a table is imported.
crm.template.guide.3=The Email column holds one email address. Format the Phone column as Text so a leading 0 is not lost.
crm.template.guide.4=Write dates as 2026-10-08 or 08/10/2026. Numbers contain only digits and a decimal point or comma, with no unit.
crm.template.guide.5=A file may have at most {0} rows and {1} MB. A customer with the same email or phone number as one already in the dataset is skipped or updated, as you choose when importing.
crm.template.guide.6=Import only people whose data your company is lawfully allowed to process (for example customers who agreed to leave their details).
