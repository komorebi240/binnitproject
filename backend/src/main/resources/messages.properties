crm.template.guide.1=Dòng đầu tiên của bảng là tên các cột; từ dòng thứ hai trở đi, mỗi dòng là một khách hàng. Hãy xóa hai dòng mẫu trước khi nhập.
crm.template.guide.2=Mỗi sheet (hoặc mỗi bảng trong Word) là một bảng dữ liệu. Nếu tệp có nhiều bảng, bạn chọn bảng cần nhập ở bước tiếp theo. Với Word, chỉ nội dung trong bảng được nhập.
crm.template.guide.3=Cột Email chứa một địa chỉ email. Cột Điện thoại nên được định dạng là Văn bản (Text) để không mất số 0 ở đầu.
crm.template.guide.4=Ngày viết dạng 2026-10-08 hoặc 08/10/2026. Số chỉ gồm chữ số và dấu chấm hoặc dấu phẩy thập phân, không kèm đơn vị.
crm.template.guide.5=Mỗi tệp tối đa {0} dòng và {1} MB. Khách trùng email hoặc số điện thoại với dữ liệu đã có sẽ được bỏ qua hoặc cập nhật, theo lựa chọn của bạn khi nhập.
crm.template.guide.6=Chỉ nhập thông tin của những người mà công ty bạn có quyền xử lý hợp pháp (ví dụ khách đã đồng ý để lại thông tin).
