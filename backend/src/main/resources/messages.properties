# Texts the server words itself, in Vietnamese - the default language (see messages_en.properties for English): emails,
# the first columns and template files of the CRM, why a CRM cell was refused, the first administrator's job title.
# The language is the one of the request being served: the frontend sends the language of its interface in
# Accept-Language, and anything else falls back to this file. The files are UTF-8.
# MessageFormat rules: a message with arguments must not contain a lone apostrophe.

mail.passwordReset.subject=Mã OTP khôi phục mật khẩu
mail.passwordReset.body=Mã OTP của bạn là: {0}\n\nMã có hiệu lực trong 10 phút. Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này.

mail.registration.subject=Mã xác minh đăng ký Orbit
mail.registration.body=Mã xác minh của bạn là: {0}\n\nMã có hiệu lực trong 10 phút. Nếu bạn không đăng ký Orbit, hãy bỏ qua email này.

mail.emailChange.subject=Mã xác nhận email mới trên Orbit
mail.emailChange.body=Mã xác nhận của bạn là: {0}\n\nMã có hiệu lực trong 15 phút. Hãy đưa mã này cho người quản lý đang đổi email tài khoản Orbit của bạn. Nếu bạn không biết về việc này, hãy bỏ qua email.

mail.emailChanged.subject=Email tài khoản Orbit đã được đổi
mail.emailChanged.body=Email đăng ký của tài khoản Orbit của bạn vừa được đổi sang {0}.\n\nNếu bạn không biết về thay đổi này, hãy liên hệ quản trị viên ngay.

# {0} = company, {1} = inviter, {2} = link
mail.invitation.subject=Lời mời tham gia {0} trên Orbit
mail.invitation.body={1} đã mời bạn tham gia {0} trên Orbit.\n\nMở liên kết sau để tạo tài khoản (hiệu lực 7 ngày):\n{2}\n\nNếu bạn không biết lời mời này, hãy bỏ qua email.

# Job title given to the person who registers a company (they can edit it afterwards).
registration.adminTitle=Quản trị viên

# CRM: the first columns of a new dataset, and why a cell was refused ({0} = the column's name).
crm.column.name=Họ tên
crm.column.email=Email
crm.column.phone=Điện thoại
crm.problem.TOO_LONG=Cột "{0}": nội dung quá dài (tối đa 2000 ký tự).
crm.problem.INVALID_NUMBER=Cột "{0}": không phải là một số hợp lệ.
crm.problem.INVALID_DATE=Cột "{0}": không phải là một ngày hợp lệ (ví dụ 2026-10-08 hoặc 08/10/2026).
crm.problem.INVALID_EMAIL=Cột "{0}": không phải là một địa chỉ email hợp lệ.
crm.problem.INVALID_PHONE=Cột "{0}": không phải là một số điện thoại hợp lệ (8 đến 15 chữ số).

