# Local development profile. Host/port/db-name have convenience defaults for a local SQL
# Server instance; credentials never do - they must come from the environment.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:project_dev};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true

app:
  dev-seed:
    # Mailbox that receives the seed accounts' password-reset codes; blank = the seed accounts have no recovery email.
    recovery-email: ${DEV_SEED_RECOVERY_EMAIL:}
    # Password of the cross-tenant broadcast account (orbit_broadcast); blank = that account is not created.
    broadcast-password: ${DEV_BROADCAST_PASSWORD:}

logging:
  level:
    com.company.project: DEBUG
